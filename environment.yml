name: stock_advisor
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # CPU-only torch wheels; other packages still resolve from PyPI.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.14.1
      - transformers==5.21.0
      - sentence-transformers==6.2.0
      - feedparser==6.0.14
      - requests==2.34.2
      - beautifulsoup4==4.15.0
      - lxml==6.1.3
      - trafilatura==2.3.1
      - statsmodels==0.15.0
      - scikit-learn==1.9.1
      - python-dotenv==1.2.4
      - ruff==0.17.3
      - yfinance==1.7.0
      - pandas==3.1.0
      - numpy==2.5.4
      - pyarrow==26.0.0
      - pytest==9.1.1
      - streamlit==1.66.1
      - plotly==7.1.0
